# ash.sanyago.space → контейнер на 127.0.0.1:8150
#
# Установка:
#   cp nginx/ash-and-iron.conf /etc/nginx/sites-available/ash.sanyago.space
#   ln -s /etc/nginx/sites-available/ash.sanyago.space /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d ash.sanyago.space
# TLS-блок дописывает certbot, здесь только HTTP и проксирование.

server {
    server_name ash.sanyago.space;

    # Кооп идёт по WebSocket и держит соединение весь забег: буферизацию
    # выключаем, таймауты поднимаем, иначе комнату рвёт на длинных волнах.
    location / {
        proxy_pass http://127.0.0.1:8150;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Спрайты и статика запекаются в образ и меняются только с релизом
    location /static/ {
        proxy_pass http://127.0.0.1:8150;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    listen 80;
}
